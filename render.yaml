services:
  - type: web
    name: ethio-bus-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OTP_SALT
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1
      - key: ENABLE_DEV_MOCK_PAYMENT
        value: "false"
      - key: SEAT_HOLD_MINUTES
        value: "15"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
